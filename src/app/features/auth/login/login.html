<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Inventory Management
                    </h2>

                    <form
                        [formGroup]="loginForm"
                        (ngSubmit)="login()">

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="email"
                                class="form-control"
                                formControlName="email">

                        </div>

                        <div class="mb-3">

                            <label>Password</label>

                            <input
                                type="password"
                                class="form-control"
                                formControlName="password">

                        </div>

                        <button
                            class="btn btn-primary w-100"
                            [disabled]="loading()">

                            {{ loading() ? 'Signing In...' : 'Login' }}

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

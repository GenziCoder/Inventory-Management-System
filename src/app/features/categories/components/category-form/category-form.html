<div class="card mb-3">

<div class="card-body">

<form
    [formGroup]="form"
    (ngSubmit)="save()">

<div class="mb-3">

<label>

Name

</label>

<input
class="form-control"
formControlName="name">

</div>

<div class="mb-3">

<label>

Description

</label>

<textarea
class="form-control"
formControlName="description">

</textarea>

</div>

<button
class="btn btn-success">

Save

</button>

</form>

</div>

</div>

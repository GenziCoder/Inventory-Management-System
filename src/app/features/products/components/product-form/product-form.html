<form [formGroup]="form" (ngSubmit)="save()">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">
                Product Code
            </label>

            <input
                type="text"
                class="form-control"
                formControlName="productCode">

            @if(form.controls.productCode.touched &&
            form.controls.productCode.invalid){

            <small class="text-danger">
                Product Code is required.
            </small>

            }

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">
                Product Name
            </label>

            <input
                type="text"
                class="form-control"
                formControlName="name">

            @if(form.controls.name.touched &&
            form.controls.name.invalid){

            <small class="text-danger">
                Product Name is required.
            </small>

            }

        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">
                Category
            </label>

            <select
                class="form-select"
                formControlName="categoryId">

                <option [ngValue]="0">
                    Select Category
                </option>

                @for(category of categories(); track category.id){

                <option [ngValue]="category.id">
                    {{ category.name }}
                </option>

                }

            </select>

            @if(form.controls.categoryId.touched &&
            form.controls.categoryId.invalid){

            <small class="text-danger">
                Category is required.
            </small>

            }

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">
                Barcode
            </label>

            <input
                type="text"
                class="form-control"
                formControlName="barcode">

        </div>

    </div>

    <div class="row">

        <div class="col-md-4 mb-3">

            <label class="form-label">
                Purchase Price
            </label>

            <input
                type="number"
                class="form-control"
                formControlName="purchasePrice">

        </div>

        <div class="col-md-4 mb-3">

            <label class="form-label">
                Selling Price
            </label>

            <input
                type="number"
                class="form-control"
                formControlName="sellingPrice">

        </div>

        <div class="col-md-4 mb-3">

            <label class="form-label">
                Stock Quantity
            </label>

            <input
                type="number"
                class="form-control"
                formControlName="stockQuantity">

        </div>

    </div>

    <div class="row">

        <div class="col-md-4 mb-3">

            <label class="form-label">
                Minimum Stock
            </label>

            <input
                type="number"
                class="form-control"
                formControlName="minimumStock">

        </div>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Description
        </label>

        <textarea
            rows="3"
            class="form-control"
            formControlName="description">
        </textarea>

    </div>

    <div class="text-end">

        <button
            class="btn btn-primary"
            type="submit"
            [disabled]="saving()">

            @if(saving()){

            <span class="spinner-border spinner-border-sm me-2"></span>

            Saving...

            }

            @else{

            Save

            }

        </button>

    </div>

</form>

<div class="card shadow-sm">

    <!-- Header -->

    <div class="card-header">

        <div class="d-flex justify-content-between align-items-center">

            <h4 class="mb-0">

                Sales

            </h4>

            <button
                class="btn btn-primary"
                (click)="addSale()">

                <i class="bi bi-plus-circle"></i>

                Add Sale

            </button>

        </div>

    </div>

    <!-- Body -->

    <div class="card-body">

        <!-- Search -->

        <div class="row mb-3">

            <div class="col-md-4">

                <input
                    #txtSearch
                    type="text"
                    class="form-control"
                    placeholder="Search Invoice / Customer"
                    (keyup.enter)="onSearch(txtSearch.value)">

            </div>

            <div class="col-md-2">

                <button
                    class="btn btn-outline-primary w-100"
                    (click)="onSearch(txtSearch.value)">

                    Search

                </button>

            </div>

        </div>

        <!-- Loading -->

        @if(loading()){

            <div class="text-center py-5">

                <div class="spinner-border text-primary"></div>

            </div>

        }

        @else{

            <app-sale-list

                [sales]="sales()"

                (edit)="editSale($event)"

                (delete)="deleteSale($event)">

            </app-sale-list>

        }

    </div>

    <!-- Footer -->

    <div class="card-footer">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                Total Records :
                <strong>{{totalRecords()}}</strong>

            </div>

            <div class="btn-group">

                <button
                    class="btn btn-outline-secondary"
                    [disabled]="pageNumber()==1"
                    (click)="onPageChange(pageNumber()-1)">

                    Previous

                </button>

                <button
                    class="btn btn-outline-secondary"
                    disabled>

                    {{pageNumber()}} / {{totalPages()}}

                </button>

                <button
                    class="btn btn-outline-secondary"
                    [disabled]="pageNumber()==totalPages()"
                    (click)="onPageChange(pageNumber()+1)">

                    Next

                </button>

            </div>

        </div>

    </div>

</div>



<app-modal

    [title]="selectedSale() ? 'Edit Sale' : 'Add Sale'"
    [visible]="showModal()"
    (visibleChange)="closeModal()">

    <app-sale-form

        [sale]="selectedSale()"

        (saved)="onSaved()">

    </app-sale-form>

</app-modal>
